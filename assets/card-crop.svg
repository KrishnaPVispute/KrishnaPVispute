<svg xmlns="http://www.w3.org/2000/svg" width="590" height="320" viewBox="0 0 590 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'Fira Code',monospace}
      .dot{animation:p 2s ease-in-out infinite} @keyframes p{50%{opacity:.3}}
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="318" rx="16" fill="url(#bg)" stroke="#1E293B"/>
  <rect x="1" y="1" width="588" height="4" rx="2" fill="url(#top)"/>
  <g class="t">
    <rect x="32" y="30" width="56" height="56" rx="14" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.6"/>
    <text x="60" y="64" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#C084FC">CNN</text>
    <text x="104" y="56" font-size="24" font-weight="700" fill="#F1F5F9">Crop Disease Detection</text>
    <text x="104" y="80" font-size="15" fill="#94A3B8">Deep learning on leaf images</text>
    <rect x="466" y="32" width="92" height="26" rx="13" fill="#2E1065"/>
    <circle cx="480" cy="45" r="4" fill="#C084FC" class="dot"/>
    <text x="490" y="50" font-size="13" font-weight="600" fill="#C084FC">Published</text>
    <text x="558" y="98" text-anchor="end" font-size="20" font-weight="800" fill="#C084FC">81% accuracy</text>
    <text x="558" y="117" text-anchor="end" font-size="12" fill="#64748B">on held-out images</text>
    <line x1="32" y1="126" x2="558" y2="126" stroke="#1E293B"/>
    <g font-size="15" fill="#CBD5E1">
    <text x="32" y="150"><tspan fill="#C084FC">▹ </tspan>MobileNet transfer-learning CNN on 1,000+ images</text>
    <text x="32" y="176"><tspan fill="#C084FC">▹ </tspan>Flask web app: upload a leaf photo, get the disease</text>
    <text x="32" y="202"><tspan fill="#C084FC">▹ </tspan>Suggests treatment for each detected disease</text>
    <text x="32" y="228"><tspan fill="#C084FC">▹ </tspan>Research paper published in IJSTM</text>
    </g>
    <g class="mono" font-size="12" font-weight="600">
    <rect x="32" y="270" width="96" height="26" rx="13" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.45"/><text x="80.0" y="287.5" text-anchor="middle" fill="#C084FC">TensorFlow</text>
    <rect x="136" y="270" width="56" height="26" rx="13" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.45"/><text x="164.0" y="287.5" text-anchor="middle" fill="#C084FC">Keras</text>
    <rect x="200" y="270" width="88" height="26" rx="13" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.45"/><text x="244.0" y="287.5" text-anchor="middle" fill="#C084FC">MobileNet</text>
    <rect x="296" y="270" width="56" height="26" rx="13" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.45"/><text x="324.0" y="287.5" text-anchor="middle" fill="#C084FC">Flask</text>
    </g>
  </g>
</svg>
