<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'Fira Code',monospace}
      .fade{opacity:0;animation:in .8s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      .caret{animation:blink 1s step-end infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)" opacity="0.6"/>
  <circle cx="960" cy="190" r="230" fill="url(#glow)"/>

  <!-- left: intro -->
  <g class="t">
    <text x="64" y="92" class="mono" font-size="18" fill="#38BDF8">&gt; hello, world. I'm<tspan class="caret">_</tspan></text>
    <text x="62" y="160" font-size="64" font-weight="800" fill="url(#name)">Krishna Vispute</text>
    <text x="64" y="202" font-size="24" font-weight="600" fill="#E2E8F0">Software Engineer  |  ML Engineer  |  Data Scientist</text>
    <text x="64" y="238" font-size="17" fill="#94A3B8">I build LLM pipelines that run in production and ML models</text>
    <text x="64" y="262" font-size="17" fill="#94A3B8">that go all the way from raw data to a working API.</text>

    <g font-size="14" font-weight="600">
      <rect x="64" y="292" width="196" height="34" rx="17" fill="#0F2A44" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="162" y="314" text-anchor="middle" fill="#7DD3FC">Maharashtra, India</text>
      <rect x="272" y="292" width="170" height="34" rx="17" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.5"/>
      <text x="357" y="314" text-anchor="middle" fill="#A5B4FC">Published: IJSTM</text>
      <rect x="454" y="292" width="200" height="34" rx="17" fill="#2E1065" stroke="#C084FC" stroke-opacity="0.5"/>
      <text x="554" y="314" text-anchor="middle" fill="#D8B4FE">Oracle OCI DS Professional</text>
    </g>
  </g>

  <!-- right: animated neural network -->
  <g stroke="#334155" stroke-width="1.4">
    <line x1="820" y1="110" x2="940" y2="80"/><line x1="820" y1="110" x2="940" y2="160"/><line x1="820" y1="110" x2="940" y2="240"/>
    <line x1="820" y1="190" x2="940" y2="80"/><line x1="820" y1="190" x2="940" y2="160"/><line x1="820" y1="190" x2="940" y2="240"/><line x1="820" y1="190" x2="940" y2="310"/>
    <line x1="820" y1="270" x2="940" y2="160"/><line x1="820" y1="270" x2="940" y2="240"/><line x1="820" y1="270" x2="940" y2="310"/>
    <line x1="940" y1="80" x2="1060" y2="150"/><line x1="940" y1="160" x2="1060" y2="150"/><line x1="940" y1="240" x2="1060" y2="150"/>
    <line x1="940" y1="160" x2="1060" y2="230"/><line x1="940" y1="240" x2="1060" y2="230"/><line x1="940" y1="310" x2="1060" y2="230"/>
    <line x1="1060" y1="150" x2="1140" y2="190"/><line x1="1060" y1="230" x2="1140" y2="190"/>
  </g>

  <g fill="#38BDF8">
    <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M820 110 L940 160 L1060 150 L1140 190"/></circle>
    <circle r="4" fill="#818CF8"><animateMotion dur="3.1s" begin="0.8s" repeatCount="indefinite" path="M820 270 L940 240 L1060 230 L1140 190"/></circle>
    <circle r="4" fill="#C084FC"><animateMotion dur="2.8s" begin="1.5s" repeatCount="indefinite" path="M820 190 L940 80 L1060 150 L1140 190"/></circle>
  </g>

  <g stroke-width="2.5">
    <circle cx="820" cy="110" r="11" fill="#0B1220" stroke="#38BDF8"/>
    <circle cx="820" cy="190" r="11" fill="#0B1220" stroke="#38BDF8"/>
    <circle cx="820" cy="270" r="11" fill="#0B1220" stroke="#38BDF8"/>
    <circle cx="940" cy="80" r="11" fill="#0B1220" stroke="#818CF8"/>
    <circle cx="940" cy="160" r="11" fill="#0B1220" stroke="#818CF8"/>
    <circle cx="940" cy="240" r="11" fill="#0B1220" stroke="#818CF8"/>
    <circle cx="940" cy="310" r="11" fill="#0B1220" stroke="#818CF8"/>
    <circle cx="1060" cy="150" r="11" fill="#0B1220" stroke="#C084FC"/>
    <circle cx="1060" cy="230" r="11" fill="#0B1220" stroke="#C084FC"/>
    <circle cx="1140" cy="190" r="15" fill="#C084FC">
      <animate attributeName="r" values="13;17;13" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="1140" y="236" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8">output</text>
</svg>
