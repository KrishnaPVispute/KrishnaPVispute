<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'Fira Code',monospace}
      .pulse{animation:p 2s ease-in-out infinite}
      @keyframes p{50%{opacity:.35}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)" stroke="#1E293B"/>
  <rect x="40" y="40" width="5" height="250" rx="2.5" fill="url(#bar)"/>
  <circle cx="42.5" cy="52" r="9" fill="#38BDF8" class="pulse"/>

  <g class="t">
    <text x="72" y="60" font-size="26" font-weight="700" fill="#F1F5F9">Software Engineer I</text>
    <text x="72" y="88" font-size="17" fill="#7DD3FC">AI &amp; data consulting  |  US healthcare clients</text>
    <rect x="980" y="38" width="180" height="32" rx="16" fill="#0F2A44" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="1070" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#7DD3FC">Feb 2026 - Present</text>

    <g font-size="16" fill="#CBD5E1">
      <text x="72" y="130"><tspan fill="#38BDF8">▹ </tspan>LLM document-intelligence platform: OCR, multi-agent extraction (Gemini, Claude) and report generation</text>
      <text x="72" y="158"><tspan fill="#38BDF8">▹ </tspan>17+ n8n workflows running 9 report sections in parallel, each with its own LLM agent and JSON schema checks</text>
      <text x="72" y="186"><tspan fill="#38BDF8">▹ </tspan>Hallucination-detection framework (BLEURT, BERTScore, ROUGE-L) that flags critical errors before delivery</text>
      <text x="72" y="214"><tspan fill="#38BDF8">▹ </tspan>FastAPI backend and review UI over PostgreSQL and AWS S3 for editing and exporting final reports</text>
    </g>

    <g>
      <rect x="72" y="238" width="250" height="62" rx="12" fill="#0F172A" stroke="#1E3A5F"/>
      <text x="92" y="268" font-size="24" font-weight="800" fill="#38BDF8">400+</text>
      <text x="92" y="289" font-size="13" fill="#94A3B8">reports generated / month</text>

      <rect x="338" y="238" width="250" height="62" rx="12" fill="#0F172A" stroke="#312E81"/>
      <text x="358" y="268" font-size="24" font-weight="800" fill="#818CF8">4-5 days → 3-4 h</text>
      <text x="358" y="289" font-size="13" fill="#94A3B8">report turnaround</text>

      <rect x="604" y="238" width="250" height="62" rx="12" fill="#0F172A" stroke="#4C1D95"/>
      <text x="624" y="268" font-size="24" font-weight="800" fill="#C084FC">1,500+ pages</text>
      <text x="624" y="289" font-size="13" fill="#94A3B8">per patient case file</text>

      <rect x="870" y="238" width="290" height="62" rx="12" fill="#0F172A" stroke="#1E293B"/>
      <text x="890" y="266" class="mono" font-size="13" fill="#7DD3FC">Python · FastAPI · n8n · LangChain</text>
      <text x="890" y="288" class="mono" font-size="13" fill="#A5B4FC">Gemini · Claude · AWS · GCP</text>
    </g>
  </g>
</svg>
