<svg xmlns="http://www.w3.org/2000/svg" width="590" height="320" viewBox="0 0 590 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'Fira Code',monospace}
      .dot{animation:p 2s ease-in-out infinite} @keyframes p{50%{opacity:.3}}
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="318" rx="16" fill="url(#bg)" stroke="#1E293B"/>
  <rect x="1" y="1" width="588" height="4" rx="2" fill="url(#top)"/>
  <g class="t">
    <rect x="32" y="30" width="56" height="56" rx="14" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.6"/>
    <text x="60" y="64" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#818CF8">SQL</text>
    <text x="104" y="56" font-size="24" font-weight="700" fill="#F1F5F9">DataGen</text>
    <text x="104" y="80" font-size="15" fill="#94A3B8">Plain English to correct SQL</text>
    <rect x="458" y="32" width="100" height="26" rx="13" fill="#1E1B4B"/>
    <circle cx="472" cy="45" r="4" fill="#818CF8" class="dot"/>
    <text x="482" y="50" font-size="13" font-weight="600" fill="#818CF8">Full stack</text>
    <text x="558" y="98" text-anchor="end" font-size="20" font-weight="800" fill="#818CF8">27-question</text>
    <text x="558" y="117" text-anchor="end" font-size="12" fill="#64748B">accuracy test suite</text>
    <line x1="32" y1="126" x2="558" y2="126" stroke="#1E293B"/>
    <g font-size="15" fill="#CBD5E1">
    <text x="32" y="150"><tspan fill="#818CF8">▹ </tspan>Ask a business question, get read-only SQL and a short answer</text>
    <text x="32" y="176"><tspan fill="#818CF8">▹ </tspan>Graph-based RAG over a Neo4j context graph</text>
    <text x="32" y="202"><tspan fill="#818CF8">▹ </tspan>Self-correcting SQL loop with safety guardrails</text>
    <text x="32" y="228"><tspan fill="#818CF8">▹ </tspan>Works with Claude or local Ollama models</text>
    </g>
    <g class="mono" font-size="12" font-weight="600">
    <rect x="32" y="270" width="72" height="26" rx="13" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.45"/><text x="68.0" y="287.5" text-anchor="middle" fill="#818CF8">FastAPI</text>
    <rect x="112" y="270" width="56" height="26" rx="13" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.45"/><text x="140.0" y="287.5" text-anchor="middle" fill="#818CF8">Neo4j</text>
    <rect x="176" y="270" width="56" height="26" rx="13" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.45"/><text x="204.0" y="287.5" text-anchor="middle" fill="#818CF8">MySQL</text>
    <rect x="240" y="270" width="64" height="26" rx="13" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.45"/><text x="272.0" y="287.5" text-anchor="middle" fill="#818CF8">Claude</text>
    <rect x="312" y="270" width="64" height="26" rx="13" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.45"/><text x="344.0" y="287.5" text-anchor="middle" fill="#818CF8">Docker</text>
    </g>
  </g>
</svg>
