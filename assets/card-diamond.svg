<svg xmlns="http://www.w3.org/2000/svg" width="590" height="320" viewBox="0 0 590 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'Cascadia Code',Consolas,'Fira Code',monospace}
      .dot{animation:p 2s ease-in-out infinite} @keyframes p{50%{opacity:.3}}
    </style>
  </defs>
  <rect x="1" y="1" width="588" height="318" rx="16" fill="url(#bg)" stroke="#1E293B"/>
  <rect x="1" y="1" width="588" height="4" rx="2" fill="url(#top)"/>
  <g class="t">
    <rect x="32" y="30" width="56" height="56" rx="14" fill="#052E2B" stroke="#34D399" stroke-opacity="0.6"/>
    <text x="60" y="64" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#34D399">ML</text>
    <text x="104" y="56" font-size="24" font-weight="700" fill="#F1F5F9">Diamond Price Prediction</text>
    <text x="104" y="80" font-size="15" fill="#94A3B8">Production-style ML pipeline</text>
    <rect x="474" y="32" width="84" height="26" rx="13" fill="#052E2B"/>
    <circle cx="488" cy="45" r="4" fill="#34D399" class="dot"/>
    <text x="498" y="50" font-size="13" font-weight="600" fill="#34D399">Deployed</text>
    <text x="558" y="98" text-anchor="end" font-size="20" font-weight="800" fill="#34D399">R2 + RMSE</text>
    <text x="558" y="117" text-anchor="end" font-size="12" fill="#64748B">cross-validated</text>
    <line x1="32" y1="126" x2="558" y2="126" stroke="#1E293B"/>
    <g font-size="15" fill="#CBD5E1">
    <text x="32" y="150"><tspan fill="#34D399">▹ </tspan>Modular pipeline: ingestion, transformation, training</text>
    <text x="32" y="176"><tspan fill="#34D399">▹ </tspan>Linear, Lasso, Ridge, ElasticNet tuned with cross-validation</text>
    <text x="32" y="202"><tspan fill="#34D399">▹ </tspan>Flask REST app for live price predictions</text>
    <text x="32" y="228"><tspan fill="#34D399">▹ </tspan>Deployed on AWS Elastic Beanstalk</text>
    </g>
    <g class="mono" font-size="12" font-weight="600">
    <rect x="32" y="270" width="64" height="26" rx="13" fill="#052E2B" stroke="#34D399" stroke-opacity="0.45"/><text x="64.0" y="287.5" text-anchor="middle" fill="#34D399">Python</text>
    <rect x="104" y="270" width="112" height="26" rx="13" fill="#052E2B" stroke="#34D399" stroke-opacity="0.45"/><text x="160.0" y="287.5" text-anchor="middle" fill="#34D399">scikit-learn</text>
    <rect x="224" y="270" width="56" height="26" rx="13" fill="#052E2B" stroke="#34D399" stroke-opacity="0.45"/><text x="252.0" y="287.5" text-anchor="middle" fill="#34D399">Flask</text>
    <rect x="288" y="270" width="40" height="26" rx="13" fill="#052E2B" stroke="#34D399" stroke-opacity="0.45"/><text x="308.0" y="287.5" text-anchor="middle" fill="#34D399">AWS</text>
    </g>
  </g>
</svg>
